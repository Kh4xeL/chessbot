<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Chess Tutor</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #1e1e1e; color: #ffffff; display: flex; flex-direction: column; align-items: center; margin-top: 30px; }
        #myBoard { width: 500px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* Updated Controls Panel */
        .controls { background-color: #2d2d2d; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 470px;}
        .controls select, .controls input[type="number"] { padding: 5px; border-radius: 4px; border: 1px solid #555; background: #333; color: white; }
        .controls label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold;}
        .controls input[type="range"] { cursor: pointer; }

        .status-box { background-color: #2d2d2d; padding: 15px 30px; border-radius: 8px; text-align: center; width: 440px; }
        .spinner { display: none; margin-top: 10px; font-style: italic; color: #4CAF50; }
        .resp { display: none; margin-top: 10px; font-style: italic; color: #3665cd; font-weight: bold;}

        /* Tutor Panel Styles */
        #tutorPanel { display: none; margin-top: 15px; text-align: left; background-color: #222; padding: 10px; border-radius: 6px; border-left: 4px solid #4CAF50; transition: all 0.3s;}
        .threat-alert { border-left: 4px solid #f44336 !important; background-color: #331a1a !important; }

        .tutor-line { margin: 5px 0; font-size: 14px; color: #ccc; }
        .tutor-move { color: #fff; font-weight: bold; background: #444; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
    </style>
</head>
<body>

<h2>Hybrid AI Chess Tutor</h2>

<div class="controls">
    <label>Engine Depth:
        <input type="number" id="depthInput" value="5" min="1" max="12" style="width: 50px;">
    </label>

    <label>AI Elo:
        <input type="range" id="eloInput" min="800" max="3000" value="2500" step="100" oninput="document.getElementById('eloDisplay').innerText = this.value">
        <span id="eloDisplay" style="color: #4CAF50;">2500</span>
    </label>

    <label>Tutor Assistance:
        <select id="assistLevel">
            <option value="0">Level 0: No Help</option>
            <option value="1">Level 1: Medium (Threat Warnings)</option>
            <option value="2">Level 2: Maximum (Top 3 & Ideas)</option>
        </select>
    </label>
</div>

<div id="myBoard"></div>

<div class="status-box">
    <div id="status">White to move</div>
    <div id="thinking" class="spinner">Engine is calculating...</div>
    <div id="move" class="resp">move</div>

    <div id="tutorPanel"></div>
</div>

<script>
    var board = null;
    var game = new Chess();
    var $status = $('#status');
    var $thinking = $('#thinking');
    var $move = $('#move');
    var $tutorPanel = $('#tutorPanel');

    function onDragStart (source, piece, position, orientation) {
        if (game.game_over()) return false;
        if (piece.search(/^b/) !== -1) return false;
    }

    function onDrop (source, target) {
        var move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        updateStatus();
        $tutorPanel.hide(); // Hide tutor while bot thinks

        window.setTimeout(makeEngineMove, 250);
    }

    function onSnapEnd () { board.position(game.fen()); }

    function updateStatus () {
        var statusHTML = '';
        var moveColor = (game.turn() === 'w') ? 'White' : 'Black';

        if (game.in_checkmate()) statusHTML = 'Game over, ' + moveColor + ' is in checkmate.';
        else if (game.in_draw()) statusHTML = 'Game over, drawn position';
        else {
            statusHTML = moveColor + ' to move';
            if (game.in_check()) statusHTML += ', ' + moveColor + ' is in check';
        }
        $status.html(statusHTML);
    }

    // --- LEVEL 1: THREAT DETECTION ---
    function getThreatDetection() {
        if (game.game_over() || game.turn() !== 'w') return;

        var currentElo = parseInt(document.getElementById('eloInput').value) || 2500;

        $tutorPanel.removeClass('threat-alert').html('<span style="color:#888;">Scanning for immediate threats...</span>').show();

        fetch('http://localhost:8000/get_threats', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fen: game.fen(), elo: currentElo }) // Uses UI Elo
        })
            .then(res => res.json())
            .then(data => {
                if (game.turn() !== 'w') return; // Ignore if user moved

                $tutorPanel.empty();

                if (data.is_threat) {
                    $tutorPanel.addClass('threat-alert');
                    $tutorPanel.append(`<strong>🚨 Tactical Alert:</strong><br><span style="color:#ffcccc;">${data.threat}</span>`);
                } else {
                    $tutorPanel.removeClass('threat-alert');
                    $tutorPanel.append(`<strong>🛡️ Coast is clear:</strong><br><span style="color:#ccc;">${data.threat}</span>`);
                }

                if (data.hint) {
                    $tutorPanel.append(`
                        <details style="margin-top: 12px; cursor: pointer; background: #333; padding: 8px; border-radius: 4px; border: 1px solid #555;">
                            <summary style="font-weight: bold; color: #4CAF50; outline: none;">💡 Need a hint?</summary>
                            <div style="margin-top: 8px; color: #fff; font-size: 15px;">
                                The engine suggests playing: <strong style="background: #555; padding: 2px 6px; border-radius: 4px;">${data.hint}</strong>
                            </div>
                        </details>
                    `);
                }
            })
            .catch(err => console.error("Threat fetch error:", err));
    }

    // --- LEVEL 2: MAXIMUM ASSISTANCE ---
    function getTutorHints() {
        if (game.game_over() || game.turn() !== 'w') return;

        console.log("--- REQUESTING LEVEL 2 (PV & TACTICS) ---");
        $tutorPanel.removeClass('threat-alert').html('<span style="color:#888;">Tutor is analyzing your best options...</span>').show();

        var currentDepth = parseInt(document.getElementById('depthInput').value) || 5;
        var currentElo = parseInt(document.getElementById('eloInput').value) || 2500;

        fetch('http://localhost:8000/get_move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                fen: game.fen(),
                elo: currentElo, // Uses UI Elo
                depth: 5,
                time_limit: 3000
            })
        })
            .then(response => response.json())
            .then(data => {
                if (game.turn() !== 'w') return;

                console.log("Level 2 API Response:", data);
                $tutorPanel.empty();
                $tutorPanel.append('<strong>Tutor Ideas (Your best moves):</strong><br>');

                if (data.top_3 && data.top_3.length > 0) {
                    data.top_3.forEach(tutor => {
                        $tutorPanel.append(`
                            <div class="tutor-line" style="margin-bottom: 8px;">
                                <span class="tutor-move">${tutor.move}</span>
                                <span style="color: #4CAF50; font-weight: bold;">${tutor.tactics || "Solid Move"}</span><br>
                                <span style="font-size: 12px; color: #aaa;">Predicted line: ${tutor.idea || "None"}</span>
                            </div>
                        `);
                    });
                } else {
                    $tutorPanel.append(`<div class="tutor-line"><span class="tutor-move">${data.move}</span> Idea: Standard Opening Book Move</div>`);
                }
            })
            .catch(err => console.error("Tutor fetch error:", err));
    }

    // --- TRIGGER ASSISTANCE BASED ON UI SELECTION ---
    function triggerAssistance() {
        var assistLevel = parseInt(document.getElementById('assistLevel').value);
        if (assistLevel === 1) getThreatDetection();
        else if (assistLevel === 2) getTutorHints();
        else $tutorPanel.hide();
    }

    $('#assistLevel').on('change', triggerAssistance);

    // --- THE BOT'S TURN ---
    function makeEngineMove() {
        if (game.game_over()) return;

        $move.hide();
        $thinking.show();

        var customDepth = parseInt(document.getElementById('depthInput').value) || 5;
        var currentElo = parseInt(document.getElementById('eloInput').value) || 2500;

        console.log("--- REQUESTING BOT MOVE ---");
        console.log(`Depth: ${customDepth}, Elo: ${currentElo}, Time Limit: 8000ms`);

        fetch('http://localhost:8000/get_move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                fen: game.fen(),
                elo: currentElo, // Uses UI Elo!
                depth: customDepth,
                time_limit: 8000 // CHANGE THIS TO 1500 IF YOU WANT THE BOT TO MOVE FASTER
            })
        })
            .then(response => response.json())
            .then(data => {
                console.log("Bot API Response:", data);

                $thinking.hide();
                $move.html('Engine responds ' + data.move + ' (' + data.time + 's)');
                $move.show();

                game.move(data.move, {sloppy: true});
                board.position(game.fen());
                updateStatus();

                triggerAssistance();
            })
            .catch(err => {
                $thinking.hide();
                console.error("API Error:", err);
                alert("Could not connect to the engine.");
            });
    }

    var config = {
        draggable: true,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
    };

    board = Chessboard('myBoard', config);
    updateStatus();
</script>
</body>
</html>
